name: Sizing Engine Regression

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'clients/**'
      - 'tests/**'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'clients/**'

jobs:
  regression:
    name: Run Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run all tests
        run: npx playwright test

      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-report
          path: reports/
          retention-days: 14

      - name: Post summary
        if: always()
        run: |
          echo "## 🧪 Regression Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ $? -eq 0 ]; then
            echo "✅ All client regression tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed — check report artifact" >> $GITHUB_STEP_SUMMARY
          fi
